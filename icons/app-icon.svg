<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Smart Schedule app icon</title>
  <desc id="desc">A mint calendar with a check mark on a dark background.</desc>
  <defs>
    <linearGradient id="background" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101d30" />
      <stop offset="1" stop-color="#070d18" />
    </linearGradient>
    <linearGradient id="calendar" x1="128" y1="112" x2="390" y2="414" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78f1c9" />
